# Local full stack: Postgres (pgvector, RLS), API, dashboard, Prometheus, Grafana.
#   cp .env.example .env && docker compose up --build
#   docker compose exec api callbridge init --demo
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: callbridge
      POSTGRES_PASSWORD: callbridge-local-only
      POSTGRES_DB: callbridge
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/sql/000_roles.sql:/docker-entrypoint-initdb.d/000_roles.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callbridge"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    env_file: .env
    environment:
      CALLBRIDGE_DATABASE_URL: postgresql+psycopg://callbridge:callbridge-local-only@db:5432/callbridge
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  dashboard:
    build:
      context: .
      dockerfile: infra/docker/dashboard.Dockerfile
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
    ports: ["3000:3000"]
    depends_on: [api]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/monitoring/grafana:/etc/grafana/provisioning:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
